[project]
name = "goldparity-analytics"
version = "0.1.0"
description = "GoldParity ingestion, normalisation, signals and REST API"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi[standard]>=0.115",
    "pandas>=2.2",
    "numpy>=2.1",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
    "pydantic-settings>=2.6",
    "httpx>=0.28",
    "apscheduler>=3.11,<4",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

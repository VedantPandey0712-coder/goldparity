name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: CI only needs to read the code. No secrets are used.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web (lint, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web
    steps:
      # Actions are pinned to full commit SHAs: a tag can be moved, a SHA cannot.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # No dependency cache on purpose: a poisoned cache can inject code into the build.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - run: npm ci
      - run: npm run lint
      - run: npm run build

  analytics:
    name: Analytics (ruff, pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: services/analytics
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: false

      # --locked fails if uv.lock is out of date with pyproject.toml.
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run pytest

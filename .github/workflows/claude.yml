# Claude Code in this repository: mention @claude in an issue or pull request comment (or a
# review) and Claude answers in a comment, for example "@claude review this PR".
#
# Security notes:
# - The action itself refuses triggers from users without write access to this repository
#   and from bots, so a contributor writing "@claude" starts nothing; only collaborators do.
# - Third-party actions are pinned to full commit SHAs, like every workflow here.
# - The workflow token is read-only on contents; comments go through the Claude GitHub App.
# - The checkout keeps no credentials. Claude reads the code; it does not run it.
# - Authentication: repository secret CLAUDE_CODE_OAUTH_TOKEN (created with
#   `claude setup-token` on a Claude subscription). With an API key instead, replace the
#   claude_code_oauth_token line by `anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}`.
name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened]

permissions: {}

concurrency:
  group: claude-${{ github.event.issue.number || github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write # the action exchanges it for a Claude GitHub App token
      actions: read # lets Claude read CI results on the PR
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Run Claude Code
        uses: anthropics/claude-code-action@f27be6b65a4652f08a2ba3cff79114829b588967 # v1.0.252
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: |
            --max-turns 40
            --append-system-prompt "You are reviewing GoldParity, a hackathon project that normalises MCX gold futures (GOLDM, GOLDTEN, GOLDGUINEA, GOLDPETAL) to rupees per gram at 999 purity and finds cross-contract spreads. Review against AGENTS.md: the web app is JavaScript (not TypeScript) and uses npm; the Python FastAPI service uses uv; contract specs live only in services/analytics/app/contracts.py; contracts are keyed by (symbol, expiry_date) and never stitched; backtests must avoid look-ahead bias and include costs. Check that progress.md was updated in the same PR, that behaviour changes come with tests, and that no secrets or .env files are committed. Be concrete: name files and lines, say what is wrong and why it matters, and say plainly when the change looks good."
